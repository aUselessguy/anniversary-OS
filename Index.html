<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aniversário OS - v2.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="ritual-container">
        <div id="flashlight"></div>
        <div id="ritual-game-area"></div>
        <div id="ritual-inventory">
            <div class="ritual-slot" id="rs0"></div>
            <div class="ritual-slot" id="rs1"></div>
            <div class="ritual-slot" id="rs2"></div>
            <div class="ritual-slot" id="rs3"></div>
        </div>
    </div>

    <div id="desktop">
        <div class="icon draggable" onclick="openApp('mines')" style="left: 20px; top: 20px;"><span class="icon-img">💣</span><span>Bomb.exe</span></div>
        <div class="icon draggable" onclick="openApp('snake')" style="left: 20px; top: 110px;"><span class="icon-img">🐍</span><span>Snake.exe</span></div>
        <div class="icon draggable" onclick="openApp('blocks')" style="left: 20px; top: 200px;"><span class="icon-img">🧱</span><span>Bloco.exe</span></div>
        <div class="icon draggable" onclick="openApp('dino')" style="left: 20px; top: 290px;"><span class="icon-img">🦖</span><span>Dino.exe</span></div>
        <a href="https://chat.whatsapp.com/C69OYCD5AQnH9mgPVjo4Mw" target="_blank" class="icon draggable" style="left: 20px; top: 380px;"><span class="icon-img">📍</span><span>Localização</span></a>
    </div>

    <div id="invite-win" class="window draggable-win" style="display:none; width: 280px; left: 50%; top: 40%; transform: translate(-50%, -50%);">
        <div class="title-bar handle"><span>Convite.txt</span></div>
        <div class="window-body">
            <p>Você foi convidado para a festa!<br>29/04/2026 às 12:50</p>
            <button onclick="confirmarPresenca()">Confirmar</button>
        </div>
    </div>

    <div id="app-win" class="window draggable-win" style="display:none; left: 5%; top: 5%;">
        <div class="title-bar handle"><span id="app-title">Software</span><div class="close-btn" onclick="closeApp()">X</div></div>
        <div class="window-body" id="app-content">
            <canvas id="gameCanvas" width="300" height="300" style="display:none;"></canvas>
            
            <div id="mines-ui" style="display:none;">
                <div class="mines-header"><div id="mine-face" class="mines-face" onclick="initMines()">🙂</div></div>
                <div id="mines-grid"></div>
            </div>

            <div id="iframe-container" style="display:none;">
                <iframe id="dino-frame" src="" width="100%" height="250px" frameborder="0"></iframe>
            </div>

            <div id="mobile-controls" style="display:none;">
                <button class="ctrl-btn" onclick="setDir(0,-1)">UP</button>
                <div style="display:flex; gap:10px;">
                    <button class="ctrl-btn" onclick="setDir(-1,0)">L</button>
                    <button class="ctrl-btn" onclick="setDir(1,0)">R</button>
                </div>
                <button class="ctrl-btn" onclick="setDir(0,1)">DOWN</button>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-btn" onclick="toggleMenu()">🎂 Iniciar</div>
        <div id="start-menu">
            <div class="menu-item" onclick="openApp('mines')">💣 Bomb.exe</div>
            <div class="menu-item" onclick="openApp('snake')">🐍 Snake.exe</div>
            <div class="menu-item" onclick="openApp('blocks')">🧱 Bloco.exe</div>
        </div>
        <div class="clock" id="relogio">00:00</div>
    </div>

    <audio id="confetti-sound" src="https://www.myinstants.com/media/sounds/confetti-pop-sound.mp3"></audio>
    <audio id="crowd-sound" src="crowd_small_chil_ec049202_9klCwI6.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
