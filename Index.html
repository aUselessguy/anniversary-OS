<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aniversário OS - Final</title>
    <style>
        :root { --win-gray: #c0c0c0; --win-blue: #000080; --win-teal: #008080; --win-shadow: #808080; }
        body { margin: 0; background-color: var(--win-teal); font-family: 'Tahoma', sans-serif; overflow: hidden; height: 100vh; user-select: none; }

        /* --- CAMADA 1: O RITUAL (INTRO) --- */
        #ritual-container { position: fixed; inset: 0; background: #000; z-index: 99999; cursor: none; transition: opacity 1.5s; }
        #flashlight { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle 250px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.95) 70%, #000 100%); z-index: 10; }
        .ritual-number { position: absolute; font-size: 80px; font-weight: bold; color: #1a0000; cursor: pointer; z-index: 5; transition: color 0.1s; }
        .ritual-number:hover { color: #ff0000; text-shadow: 0 0 20px #f00; }
        #ritual-inventory { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 20; }
        .ritual-slot { width: 50px; height: 70px; border-bottom: 3px solid #330000; font-size: 50px; text-align: center; color: #ff0000; }

        /* --- CAMADA 2: DESKTOP --- */
        .window { position: absolute; background: var(--win-gray); border: 2px solid; border-color: #fff var(--win-shadow) var(--win-shadow) #fff; padding: 2px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); display: none; }
        .title-bar { background: linear-gradient(90deg, var(--win-blue), #1084d0); color: #fff; padding: 3px 5px; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
        .close-btn { background: var(--win-gray); border: 1px solid #000; width: 16px; height: 14px; text-align: center; line-height: 12px; cursor: pointer; color: #000; }
        .window-body { padding: 10px; display: flex; flex-direction: column; align-items: center; }

        .icon { position: absolute; width: 75px; text-align: center; color: white; text-decoration: none; font-size: 12px; text-shadow: 1px 1px #000; padding: 5px; cursor: pointer; }
        .icon-img { font-size: 35px; display: block; margin-bottom: 5px; }

        /* CONTROLES MOBILE */
        #mobile-controls { display: none; margin-top: 10px; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .ctrl-btn { width: 50px; height: 50px; background: #eee; border: 2px outset #fff; font-weight: bold; font-size: 18px; }

        /* TASKBAR */
        .taskbar { position: fixed; bottom: 0; width: 100%; height: 35px; background: var(--win-gray); border-top: 2px solid #fff; display: flex; align-items: center; z-index: 9000; }
        .start-btn { font-weight: bold; padding: 2px 10px; border: 2px outset #fff; margin-left: 5px; cursor: pointer; }
        .clock { margin-left: auto; border: 2px inset #fff; padding: 0 10px; margin-right: 5px; font-size: 12px; }

        /* JOGOS */
        #mines-grid { display: grid; grid-template-columns: repeat(8, 25px); background: #808080; border: 2px inset #fff; }
        .cell { width: 25px; height: 25px; border: 2px outset #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .cell.revealed { border: 1px solid #999; background: #bbb; }
        canvas { background: #000; border: 2px inset #fff; max-width: 100%; }
    </style>
</head>
<body>

    <div id="ritual-container">
        <div id="flashlight"></div>
        <div id="ritual-game-area"></div>
        <div id="ritual-inventory">
            <div class="ritual-slot" id="rs0"></div>
            <div class="ritual-slot" id="rs1"></div>
            <div class="ritual-slot" id="rs2"></div>
            <div class="ritual-slot" id="rs3"></div>
        </div>
    </div>

    <div id="desktop">
        <div class="icon" onclick="openApp('mines')" style="left: 20px; top: 20px;"><span class="icon-img">💣</span><span>Bomb.exe</span></div>
        <div class="icon" onclick="openApp('snake')" style="left: 20px; top: 110px;"><span class="icon-img">🐍</span><span>Snake.exe</span></div>
        <div class="icon" onclick="openApp('blocks')" style="left: 20px; top: 200px;"><span class="icon-img">🧱</span><span>Bloco.exe</span></div>
        <a href="https://chat.whatsapp.com/C69OYCD5AQnH9mgPVjo4Mw" target="_blank" class="icon" style="left: 20px; top: 290px;"><span class="icon-img">📍</span><span>Localização</span></a>
    </div>

    <div id="app-win" class="window" style="left: 50%; top: 40%; transform: translate(-50%, -50%);">
        <div class="title-bar"><span id="app-title">Software</span><div class="close-btn" onclick="closeApp()">X</div></div>
        <div class="window-body">
            <canvas id="gameCanvas" width="240" height="240" style="display:none;"></canvas>
            
            <div id="mines-ui" style="display:none;">
                <div id="mines-grid"></div>
                <button onclick="initMines()" style="margin-top:5px;">Reiniciar</button>
            </div>

            <div id="mobile-controls">
                <div></div><button class="ctrl-btn" onclick="setDir(0,-1)">↑</button><div></div>
                <button class="ctrl-btn" onclick="setDir(-1,0)">←</button>
                <button class="ctrl-btn" onclick="setDir(0,1)">↓</button>
                <button class="ctrl-btn" onclick="setDir(1,0)">→</button>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-btn">🎂 Iniciar</div>
        <div class="clock" id="relogio">00:00</div>
    </div>

    <audio id="crowd-sound" src="crowd_small_chil_ec049202_9klCwI6.mp3"></audio>

    <script>
        // --- LÓGICA RITUAL ---
        let step = 0; const sequence = [2, 9, 0, 4];
        const flashlight = document.getElementById('flashlight');

        const moveFlash = (e) => {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            flashlight.style.setProperty('--x', x + 'px');
            flashlight.style.setProperty('--y', y + 'px');
        };
        window.addEventListener('mousemove', moveFlash);
        window.addEventListener('touchmove', moveFlash);

        function spawnNumber() {
            if (step >= 4) {
                document.getElementById('ritual-container').style.opacity = '0';
                setTimeout(() => { 
                    document.getElementById('ritual-container').style.display = 'none';
                    document.getElementById('crowd-sound').play();
                }, 1500);
                return;
            }
            const area = document.getElementById('ritual-game-area');
            const n = document.createElement('div');
            n.className = 'ritual-number'; n.innerText = sequence[step];
            n.style.left = Math.random() * 70 + 10 + '%';
            n.style.top = Math.random() * 70 + 10 + '%';
            
            const hit = () => {
                document.getElementById('rs'+step).innerText = sequence[step];
                n.remove(); step++; spawnNumber();
            };
            n.onclick = hit; n.ontouchstart = hit;
            area.appendChild(n);
        }
        spawnNumber();

        // --- SISTEMA E JOGOS ---
        let gameActive = false, currentGame = "", snake = [], dir = {x:1, y:0}, ball = {}, paddle = {}, blocks = [];

        function openApp(app) {
            const win = document.getElementById('app-win');
            win.style.display = 'block';
            document.getElementById('app-title').innerText = app.toUpperCase() + ".EXE";
            document.getElementById('gameCanvas').style.display = 'none';
            document.getElementById('mines-ui').style.display = 'none';
            document.getElementById('mobile-controls').style.display = 'none';
            
            gameActive = true; currentGame = app;
            if(app === 'mines') { document.getElementById('mines-ui').style.display = 'block'; initMines(); }
            else { 
                document.getElementById('gameCanvas').style.display = 'block';
                if(window.innerWidth < 600) document.getElementById('mobile-controls').style.display = 'grid';
                if(app === 'snake') initSnake(); else initBlocks();
            }
        }

        function closeApp() { document.getElementById('app-win').style.display = 'none'; gameActive = false; }

        // --- SNAKE ---
        function setDir(x, y) { dir = {x, y}; }
        function initSnake() { snake = [{x:5, y:5}]; dir = {x:1, y:0}; runSnake(); }
        function runSnake() {
            if(!gameActive || currentGame !== 'snake') return;
            const ctx = document.getElementById('gameCanvas').getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,240,240);
            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
            if(head.x < 0 || head.x > 11 || head.y < 0 || head.y > 11) { initSnake(); return; }
            snake.unshift(head); snake.pop();
            ctx.fillStyle = 'lime'; snake.forEach(p => ctx.fillRect(p.x*20, p.y*20, 18, 18));
            setTimeout(runSnake, 200);
        }

        // --- BLOCOS ---
        function initBlocks() {
            ball = {x:120, y:200, dx:2, dy:-2}; paddle = {x:100}; blocks = [];
            for(let i=0; i<4; i++) for(let j=0; j<3; j++) blocks.push({x: i*60+5, y: j*20+10, active: true});
            runBlocks();
        }
        function runBlocks() {
            if(!gameActive || currentGame !== 'blocks') return;
            const ctx = document.getElementById('gameCanvas').getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,240,240);
            ball.x += ball.dx; ball.y += ball.dy;
            if(ball.x<0 || ball.x>235) ball.dx *= -1;
            if(ball.y<0) ball.dy *= -1;
            if(ball.y>235) { initBlocks(); return; }
            if(ball.y > 220 && ball.x > paddle.x && ball.x < paddle.x + 40) ball.dy *= -1;
            ctx.fillStyle = 'white'; ctx.fillRect(paddle.x, 230, 40, 5);
            ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 4, 0, 7); ctx.fill();
            blocks.forEach(b => {
                if(b.active) {
                    ctx.fillStyle = 'red'; ctx.fillRect(b.x, b.y, 50, 15);
                    if(ball.x > b.x && ball.x < b.x+50 && ball.y > b.y && ball.y < b.y+15) { b.active = false; ball.dy *= -1; }
                }
            });
            document.getElementById('gameCanvas').ontouchmove = (e) => { 
                paddle.x = e.touches[0].clientX - e.target.getBoundingClientRect().left - 20; 
            };
            requestAnimationFrame(runBlocks);
        }

        // --- BOMBA ---
        function initMines() {
            const grid = document.getElementById('mines-grid'); grid.innerHTML = '';
            const mines = Array(64).fill(0).map(() => Math.random() < 0.15);
            for(let i=0; i<64; i++) {
                const c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => {
                    if(mines[i]) { c.style.background = 'red'; c.innerText = '💣'; alert('BOOM!'); initMines(); }
                    else { c.classList.add('revealed'); c.innerText = '0'; }
                };
                grid.appendChild(c);
            }
        }

        setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }, 1000);
    </script>
</body>
</html>
