<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aniversário OS</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --win-gray: #c0c0c0; --win-blue: #000080; --win-teal: #008080; --win-shadow: #808080; }
        body, html { margin: 0; padding: 0; background: var(--win-teal); font-family: 'Tahoma', sans-serif; overflow: hidden; height: 100vh; user-select: none; touch-action: none; }

        /* --- 1. RITUAL --- */
        #ritual-container { position: fixed; inset: 0; background: #000; z-index: 99999; cursor: none; transition: opacity 1.5s; }
        #flashlight { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle 250px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.95) 60%, #000 100%); z-index: 10; }
        
        /* Animação para os números brilharem sozinhos no celular */
        @keyframes pulseGlow {
            0% { color: #3a0000; text-shadow: 0 0 5px #f00; }
            100% { color: #ff0000; text-shadow: 0 0 20px #f00; }
        }
        .ritual-number { position: absolute; font-size: 80px; font-weight: bold; cursor: pointer; z-index: 5; animation: pulseGlow 1.5s infinite alternate; }
        
        #ritual-inventory { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 20; }
        .ritual-slot { width: 50px; height: 70px; border-bottom: 3px solid #330000; font-size: 50px; text-align: center; color: #ff0000; font-family: 'Courier New', Courier, monospace;}

        /* --- 2. SISTEMA OS --- */
        .window { position: absolute; background: var(--win-gray); border: 2px solid; border-color: #fff var(--win-shadow) var(--win-shadow) #fff; display: none; z-index: 1000; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .title-bar { background: linear-gradient(90deg, var(--win-blue), #1084d0); color: #fff; padding: 3px 5px; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; cursor: move; }
        .close-btn { background: var(--win-gray); border: 1px solid #000; width: 16px; height: 14px; text-align: center; line-height: 12px; cursor: pointer; color: #000; font-family: sans-serif;}
        .window-body { padding: 10px; display: flex; flex-direction: column; align-items: center; }
        button { background: var(--win-gray); border: 2px outset #fff; padding: 5px 15px; cursor: pointer; font-family: 'Tahoma'; font-weight: bold; }
        button:active { border-style: inset; }

        /* ÍCONES DESKTOP */
        .icon { position: absolute; width: 70px; text-align: center; color: white; font-size: 12px; text-shadow: 1px 1px #000; padding: 5px; cursor: pointer; text-decoration: none; }
        .icon-img { font-size: 35px; display: block; margin-bottom: 5px; }

        /* TASKBAR */
        .taskbar { position: fixed; bottom: 0; width: 100%; height: 35px; background: var(--win-gray); border-top: 2px solid #fff; display: flex; align-items: center; z-index: 9000; }
        .clock { margin-left: auto; border: 2px inset #fff; padding: 0 10px; margin-right: 5px; font-size: 12px; height: 22px; display: flex; align-items: center; }

        /* BALÕES CONVITE */
        .baloes-container { position: absolute; top: -50px; width: 100%; height: 50px; pointer-events: none; }
        .balloon-wrapper { position: absolute; animation: float 2s infinite alternate; }
        .balloon { width: 25px; height: 35px; border-radius: 50%; }
        .string { width: 1px; height: 30px; background: #fff; margin: 0 auto; }
        @keyframes float { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        /* --- 3. JOGOS --- */
        /* O fundo preto agora aplica APENAS ao jogo, e não aos confetes */
        #gameCanvas { background: #000; border: 2px inset #fff; display: block; }
        
        /* BOMB.EXE */
        #mines-ui { background: var(--win-gray); border: 2px outset #fff; padding: 6px; }
        .mines-header { display: flex; justify-content: space-between; align-items: center; border: 2px inset #fff; padding: 4px; margin-bottom: 6px; }
        .mines-counter { background: black; color: red; font-family: monospace; font-size: 22px; font-weight: bold; padding: 0 5px; border: 1px inset #fff; }
        .mines-face { border: 2px outset #fff; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; margin: 0 2px;}
        .mines-face:active { border-style: inset; }
        #mines-grid { display: grid; grid-template-columns: repeat(10, 20px); border: 3px inset #fff; background: #808080; }
        .cell { width: 20px; height: 20px; border: 2px outset #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; background: #c0c0c0; box-sizing: border-box; }
        .cell.revealed { border: 1px solid #808080; background: #c0c0c0; }

        /* CONTROLES MOBILE SNAKE/BLOCO */
        #mobile-controls { display: none; flex-direction: column; align-items: center; gap: 5px; margin-top: 10px; }
        .ctrl-row { display: flex; gap: 5px; }
        .ctrl-btn { width: 55px; height: 55px; font-size: 24px; display: flex; align-items: center; justify-content: center; border: 2px outset #fff; background: #dfdfdf; font-weight: bold; touch-action: manipulation; cursor: pointer; }
        .ctrl-btn:active { border-style: inset; background: #bfbfbf; }

    </style>
</head>
<body>

    <div id="ritual-container">
        <div id="flashlight"></div>
        <div id="ritual-game-area"></div>
        <div id="ritual-inventory">
            <div class="ritual-slot" id="rs0"></div>
            <div class="ritual-slot" id="rs1"></div>
            <div class="ritual-slot" id="rs2"></div>
            <div class="ritual-slot" id="rs3"></div>
        </div>
    </div>

    <div id="desktop">
        <div class="icon draggable" onclick="openApp('mines')" style="left: 20px; top: 20px;"><span class="icon-img">💣</span><span>Bomb.exe</span></div>
        <div class="icon draggable" onclick="openApp('snake')" style="left: 20px; top: 110px;"><span class="icon-img">🐍</span><span>Snake.exe</span></div>
        <div class="icon draggable" onclick="openApp('blocks')" style="left: 20px; top: 200px;"><span class="icon-img">🧱</span><span>Bloco.exe</span></div>
        <div class="icon draggable" onclick="openApp('dino')" style="left: 20px; top: 290px;"><span class="icon-img">🦖</span><span>Dino.exe</span></div>
        <a href="https://chat.whatsapp.com/C69OYCD5AQnH9mgPVjo4Mw" target="_blank" class="icon draggable" style="left: 20px; top: 380px;"><span class="icon-img">📍</span><span>Localização</span></a>
    </div>

    <div id="invite-win" class="window draggable-win" style="width: 280px; left: 50%; top: 40%; transform: translate(-50%, -50%);">
        <div class="baloes-container">
            <div class="balloon-wrapper" style="left: 20px;"><div class="balloon" style="background:#ff4d4d"></div><div class="string"></div></div>
            <div class="balloon-wrapper" style="left: 100px;"><div class="balloon" style="background:#4da6ff"></div><div class="string"></div></div>
            <div class="balloon-wrapper" style="left: 180px;"><div class="balloon" style="background:#ffcc00"></div><div class="string"></div></div>
        </div>
        <div class="title-bar handle"><span>Convite_Aniversario.txt</span></div>
        <div class="window-body">
            <h3 style="margin-top: 5px;">Você foi convidado!</h3>
            <p style="margin-bottom: 15px;">Sábado, 29/04/2026 às 12:50</p>
            <button onclick="confirmarPresenca()">Confirmar Presença</button>
        </div>
    </div>

    <div id="app-win" class="window draggable-win" style="left: 5%; top: 5%;">
        <div class="title-bar handle"><span id="app-title">App</span><div class="close-btn" onclick="closeApp()">X</div></div>
        <div class="window-body" style="background: var(--win-gray);">
            
            <canvas id="gameCanvas" width="240" height="240" style="display:none;"></canvas>
            
            <div id="mines-ui" style="display:none;">
                <div class="mines-header">
                    <div id="mine-flags" class="mines-counter">010</div>
                    <div style="display: flex;">
                        <div id="mine-face" class="mines-face" onclick="initMines()">🙂</div>
                        <div id="mine-mode" class="mines-face" onclick="toggleMineMode()">⛏️</div>
                    </div>
                    <div id="mine-timer" class="mines-counter">000</div>
                </div>
                <div id="mines-grid"></div>
            </div>

            <div id="iframe-container" style="display:none;">
                <iframe id="dino-frame" src="" width="100%" height="240px" frameborder="0"></iframe>
            </div>

            <div id="mobile-controls">
                <button class="ctrl-btn" onclick="setDir(0,-1)">↑</button>
                <div class="ctrl-row">
                    <button class="ctrl-btn" onclick="setDir(-1,0)">←</button>
                    <button class="ctrl-btn" onclick="setDir(0,1)">↓</button>
                    <button class="ctrl-btn" onclick="setDir(1,0)">→</button>
                </div>
            </div>

        </div>
    </div>

    <div class="taskbar">
        <div style="font-weight:bold; padding:2px 10px; border:2px outset #fff; margin-left:5px; display: flex; align-items: center; gap: 5px;">🎂 Iniciar</div>
        <div class="clock" id="relogio">00:00</div>
    </div>

    <audio id="confetti-sound" src="https://www.myinstants.com/media/sounds/confetti-pop-sound.mp3" preload="auto"></audio>
    <audio id="yay-sound" src="https://www.myinstants.com/media/sounds/yay_z1E1ipn.mp3" preload="auto"></audio>
    <audio id="crowd-sound" src="crowd_small_chil_ec049202_9klCwI6.mp3" preload="auto"></audio>

    <script>
        // --- 1. RITUAL LÓGICA ---
        const ritualSequence = [2, 9, 0, 4];
        let ritualStep = 0, lastX = -1, lastY = -1;
        const flash = document.getElementById('flashlight');

        function moveLight(e) {
            let x = e.clientX || (e.touches && e.touches[0].clientX);
            let y = e.clientY || (e.touches && e.touches[0].clientY);
            if(x !== undefined) { 
                flash.style.setProperty('--x', x + 'px'); 
                flash.style.setProperty('--y', y + 'px'); 
            }
        }
        window.addEventListener('mousemove', moveLight);
        window.addEventListener('touchmove', moveLight, {passive: false});

        function spawnRitual() {
            if(ritualStep >= 4) {
                document.getElementById('ritual-container').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('ritual-container').style.display = 'none';
                    document.getElementById('invite-win').style.display = 'block';
                }, 1500);
                return;
            }
            const n = document.createElement('div');
            n.className = 'ritual-number'; 
            n.innerText = ritualSequence[ritualStep];
            
            let rx, ry, dist=0;
            do {
                rx = Math.random() * (window.innerWidth - 100) + 50;
                ry = Math.random() * (window.innerHeight - 150) + 50;
                dist = Math.sqrt(Math.pow(rx-lastX,2) + Math.pow(ry-lastY,2));
            } while(dist < 150 && lastX !== -1);
            
            lastX = rx; lastY = ry;
            n.style.left = rx+'px'; n.style.top = ry+'px';
            
            const hit = (e) => {
                e.preventDefault();
                document.getElementById('rs'+ritualStep).innerText = ritualSequence[ritualStep];
                n.remove(); ritualStep++; spawnRitual();
            };
            n.onclick = hit; n.ontouchstart = hit;
            document.getElementById('ritual-game-area').appendChild(n);
        }
        spawnRitual();

        // --- 2. SISTEMA OS E FESTA ---
        let z = 1000, gameActive = false, currentGame = "";
        setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }, 1000);

        function confirmarPresenca() {
            document.getElementById('invite-win').style.display = 'none';
            
            const a1 = document.getElementById('confetti-sound');
            const a2 = document.getElementById('yay-sound');
            const a3 = document.getElementById('crowd-sound');
            
            a1.currentTime = 0; a2.currentTime = 0; a3.currentTime = 0;
            a1.volume = 0.5; a2.volume = 0.6; a3.volume = 0.8;
            
            Promise.all([a1.play(), a2.play(), a3.play()]).catch(e => console.log(e));
            
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        }

        function openApp(app) {
            const win = document.getElementById('app-win');
            win.style.display = 'block'; win.style.zIndex = ++z;
            document.getElementById('app-title').innerText = app.toUpperCase() + ".EXE";
            
            document.getElementById('gameCanvas').style.display = 'none';
            document.getElementById('mines-ui').style.display = 'none';
            document.getElementById('iframe-container').style.display = 'none';
            document.getElementById('mobile-controls').style.display = 'none';
            
            gameActive = true; currentGame = app;

            if(app === 'dino') { 
                document.getElementById('iframe-container').style.display = 'block'; 
                document.getElementById('dino-frame').src="https://chromedino.com/"; 
            }
            else if(app === 'mines') { 
                document.getElementById('mines-ui').style.display = 'block'; 
                initMines(); 
            }
            else {
                document.getElementById('gameCanvas').style.display = 'block';
                if(app === 'snake') {
                    if(window.innerWidth < 600) document.getElementById('mobile-controls').style.display = 'flex';
                    initSnake();
                } else if (app === 'blocks') {
                    initBlocks();
                }
            }
        }
        function closeApp() { gameActive = false; document.getElementById('app-win').style.display = 'none'; clearInterval(mineTimerInt); }

        // --- 3. JOGOS ---

        // SNAKE
        let snake = [], dir = {x:1, y:0}, food = {};
        window.setDir = function(dx, dy) {
            if (dir.x === 0 && dx === 0) return;
            if (dir.y === 0 && dy === 0) return;
            dir = {x: dx, y: dy};
        };
        function initSnake() { snake = [{x:5,y:5}]; dir = {x:1,y:0}; food = {x:8,y:8}; runSnake(); }
        function runSnake() {
            if(!gameActive || currentGame !== 'snake') return;
            const ctx = document.getElementById('gameCanvas').getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,240,240);
            
            let h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
            
            if(h.x === food.x && h.y === food.y) {
                food = {x: Math.floor(Math.random()*12), y: Math.floor(Math.random()*12)};
            } else { 
                snake.pop(); 
            }
            
            let colision = false;
            snake.forEach(p => { if(h.x === p.x && h.y === p.y) colision = true; });

            if(h.x<0 || h.x>11 || h.y<0 || h.y>11 || colision) { 
                document.getElementById('app-title').innerText = "SNAKE.EXE - GAME OVER";
                setTimeout(() => { document.getElementById('app-title').innerText = "SNAKE.EXE"; initSnake(); }, 1500); 
                return; 
            }
            
            snake.unshift(h);
            ctx.fillStyle = 'lime'; snake.forEach(s => ctx.fillRect(s.x*20, s.y*20, 18, 18));
            ctx.fillStyle = 'red'; ctx.fillRect(food.x*20, food.y*20, 18, 18);
            setTimeout(runSnake, 180);
        }
        window.addEventListener('keydown', e => {
            if(currentGame !== 'snake') return;
            if(e.key==="ArrowUp") setDir(0,-1); if(e.key==="ArrowDown") setDir(0,1);
            if(e.key==="ArrowLeft") setDir(-1,0); if(e.key==="ArrowRight") setDir(1,0);
        });

        // BLOCOS
        let ball = {}, paddle = {}, blocks = [];
        function initBlocks() {
            ball = {x:120, y:200, dx:2, dy:-2}; paddle = {x:100}; blocks = [];
            for(let i=0; i<4; i++) for(let j=0; j<3; j++) blocks.push({x: i*60+5, y: j*20+10, active: true});
            runBlocks();
        }
        function runBlocks() {
            if(!gameActive || currentGame !== 'blocks') return;
            const ctx = document.getElementById('gameCanvas').getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,240,240);
            
            ball.x += ball.dx; ball.y += ball.dy;
            if(ball.x<0 || ball.x>235) ball.dx *= -1; 
            if(ball.y<0) ball.dy *= -1;
            
            if(ball.y>240) { initBlocks(); return; }
            if(ball.y>220 && ball.x>paddle.x && ball.x<paddle.x+40) ball.dy *= -1;
            
            ctx.fillStyle = 'white'; ctx.fillRect(paddle.x, 230, 40, 5);
            ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 4, 0, 7); ctx.fill();
            
            blocks.forEach(b => {
                if(b.active) {
                    ctx.fillStyle = 'red'; ctx.fillRect(b.x, b.y, 50, 15);
                    if(ball.x>b.x && ball.x<b.x+50 && ball.y>b.y && ball.y<b.y+15) { b.active=false; ball.dy*=-1; }
                }
            });
            requestAnimationFrame(runBlocks);
        }
        document.getElementById('gameCanvas').ontouchmove = (e) => { 
            if(currentGame === 'blocks') { paddle.x = e.touches[0].clientX - e.target.getBoundingClientRect().left - 20; e.preventDefault(); } 
        };
        document.getElementById('gameCanvas').onmousemove = (e) => { 
            if(currentGame === 'blocks') paddle.x = e.clientX - e.target.getBoundingClientRect().left - 20; 
        };

        // BOMB.EXE
        let mBoard = [], mTime = 0, mineTimerInt, mFlags = 10, flagMode = false, firstClickM = true, revCount = 0;
        const R = 10, C = 10, M = 10;
        
        function toggleMineMode() { 
            flagMode = !flagMode; 
            document.getElementById('mine-mode').innerText = flagMode ? '🚩' : '⛏️'; 
        }

        function initMines() {
            clearInterval(mineTimerInt); mTime = 0; mFlags = M; firstClickM = true; revCount = 0; flagMode = false; gameActive = true;
            document.getElementById('mine-timer').innerText = "000";
            document.getElementById('mine-flags').innerText = "010";
            document.getElementById('mine-face').innerText = "🙂";
            document.getElementById('mine-mode').innerText = "⛏️";
            
            const grid = document.getElementById('mines-grid'); grid.innerHTML = '';
            mBoard = [];
            for(let r=0; r<R; r++){
                let row = [];
                for(let c=0; c<C; c++){
                    let cell = document.createElement('div'); cell.className = 'cell';
                    cell.onclick = () => handleMClick(r, c);
                    cell.oncontextmenu = (e) => { e.preventDefault(); handleFlag(r, c); };
                    grid.appendChild(cell);
                    row.push({el: cell, mine: false, rev: false, flag: false, n: 0});
                }
                mBoard.push(row);
            }
        }

        function genMines(fr, fc) {
            let placed = 0;
            while(placed < M) {
                let r = Math.floor(Math.random() * R), c = Math.floor(Math.random() * C);
                if(!mBoard[r][c].mine && (r !== fr || c !== fc)) { mBoard[r][c].mine = true; placed++; }
            }
            for(let r=0; r<R; r++) for(let c=0; c<C; c++) {
                if(!mBoard[r][c].mine) {
                    let count = 0;
                    for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++) {
                        if(r+dr>=0 && r+dr<R && c+dc>=0 && c+dc<C && mBoard[r+dr][c+dc].mine) count++;
                    }
                    mBoard[r][c].n = count;
                }
            }
        }

        function handleMClick(r, c) {
            if(!gameActive) return;
            if(flagMode) handleFlag(r, c);
            else {
                let cell = mBoard[r][c];
                if(cell.flag || cell.rev) return;
                if(firstClickM) {
                    firstClickM = false; genMines(r, c);
                    mineTimerInt = setInterval(() => { mTime++; document.getElementById('mine-timer').innerText = Math.min(mTime, 999).toString().padStart(3,'0'); }, 1000);
                }
                revealM(r, c); checkMWin();
            }
        }

        function handleFlag(r, c) {
            let cell = mBoard[r][c];
            if(cell.rev || !gameActive) return;
            cell.flag = !cell.flag;
            cell.el.innerText = cell.flag ? '🚩' : '';
            mFlags += cell.flag ? -1 : 1;
            document.getElementById('mine-flags').innerText = mFlags.toString().padStart(3,'0');
        }

        function revealM(r, c) {
            let cell = mBoard[r][c];
            if(cell.rev || cell.flag) return;
            cell.rev = true; revCount++; cell.el.classList.add('revealed');
            
            if(cell.mine) {
                cell.el.innerText = '💣'; cell.el.style.background = 'red';
                document.getElementById('mine-face').innerText = '😵';
                gameActive = false; clearInterval(mineTimerInt);
                for(let i=0; i<R; i++) for(let j=0; j<C; j++) {
                    if(mBoard[i][j].mine && !mBoard[i][j].flag) { mBoard[i][j].el.innerText = '💣'; mBoard[i][j].el.classList.add('revealed'); }
                }
            } else {
                if(cell.n > 0) {
                    cell.el.innerText = cell.n;
                    const colors = ['','blue','green','red','darkblue','maroon','teal','black','gray'];
                    cell.el.style.color = colors[cell.n];
                } else {
                    for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++) {
                        if(r+dr>=0 && r+dr<R && c+dc>=0 && c+dc<C) revealM(r+dr, c+dc);
                    }
                }
            }
        }

        function checkMWin() {
            if(revCount === (R*C) - M && gameActive) {
                document.getElementById('mine-face').innerText = '😎';
                gameActive = false; clearInterval(mineTimerInt);
            }
        }

        // --- 4. DRAG WINDOWS ---
        document.querySelectorAll('.draggable, .draggable-win').forEach(el => {
            const handle = el.classList.contains('draggable-win') ? el.querySelector('.handle') : el;
            handle.onmousedown = handle.ontouchstart = (e) => {
                if(e.target.tagName === 'BUTTON' || e.target.classList.contains('close-btn')) return;
                el.style.zIndex = ++z;
                let evt = e.touches ? e.touches[0] : e;
                let startX = evt.clientX, startY = evt.clientY;
                
                const move = (ev) => {
                    let evT = ev.touches ? ev.touches[0] : ev;
                    el.style.left = (el.offsetLeft - (startX - evT.clientX)) + "px";
                    el.style.top = (el.offsetTop - (startY - evT.clientY)) + "px";
                    el.style.transform = "none";
                    startX = evT.clientX; startY = evT.clientY;
                    ev.preventDefault(); 
                };
                
                document.onmousemove = document.ontouchmove = move;
                document.onmouseup = document.ontouchend = () => { 
                    document.onmousemove = document.ontouchmove = null; 
                };
            };
        });

    </script>
</body>
</html>
