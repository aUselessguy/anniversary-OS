<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aniversário OS</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --win-gray: #c0c0c0; --win-blue: #000080; --win-teal: #008080; --win-shadow: #808080; }
        body, html { margin: 0; padding: 0; background: var(--win-teal); font-family: 'Tahoma', sans-serif; overflow: hidden; height: 100vh; user-select: none; touch-action: none; }

        /* --- RITUAL --- */
        #ritual-container { position: fixed; inset: 0; background: #000; z-index: 99999; transition: opacity 1.5s; }
        #flashlight { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle 250px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.95) 60%, #000 100%); z-index: 10; }
        @keyframes pulseGlow { 0% { color: #3a0000; text-shadow: 0 0 5px #f00; } 100% { color: #ff0000; text-shadow: 0 0 20px #f00; } }
        .ritual-number { position: absolute; font-size: 80px; font-weight: bold; cursor: pointer; z-index: 5; animation: pulseGlow 1.5s infinite alternate; }
        #ritual-inventory { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 20; }
        .ritual-slot { width: 50px; height: 70px; border-bottom: 3px solid #330000; font-size: 50px; text-align: center; color: #ff0000; font-family: 'Courier New', monospace;}

        /* --- JANELAS --- */
        .window { position: absolute; background: var(--win-gray); border: 2px solid; border-color: #fff var(--win-shadow) var(--win-shadow) #fff; display: none; z-index: 1000; }
        .title-bar { background: linear-gradient(90deg, var(--win-blue), #1084d0); color: #fff; padding: 3px 5px; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
        .window-body { padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* CORREÇÃO DO FUNDO PRETO: O fundo preto só se aplica ao canvas do JOGO */
        #gameCanvas { background: #000 !important; border: 2px inset #fff; display: block; }
        /* Garante que o canvas do confetti seja sempre transparente */
        canvas:not(#gameCanvas) { background: transparent !important; }

        /* ÍCONES E TASKBAR */
        .icon { position: absolute; width: 70px; text-align: center; color: white; font-size: 12px; text-shadow: 1px 1px #000; cursor: pointer; }
        .taskbar { position: fixed; bottom: 0; width: 100%; height: 35px; background: var(--win-gray); border-top: 2px solid #fff; display: flex; align-items: center; z-index: 9000; }
        
        /* CONTROLES MOBILE */
        #mobile-controls { display: none; flex-direction: column; align-items: center; gap: 5px; margin-top: 10px; }
        .ctrl-btn { width: 55px; height: 55px; font-size: 24px; border: 2px outset #fff; background: #dfdfdf; touch-action: manipulation; }
    </style>
</head>
<body>

    <div id="ritual-container">
        <div id="flashlight"></div>
        <div id="ritual-game-area"></div>
        <div id="ritual-inventory"><div class="ritual-slot" id="rs0"></div><div class="ritual-slot" id="rs1"></div><div class="ritual-slot" id="rs2"></div><div class="ritual-slot" id="rs3"></div></div>
    </div>

    <div id="desktop">
        <div class="icon" onclick="openApp('mines')" style="left: 20px; top: 20px;"><span>💣</span><br>Bomb.exe</div>
        <div class="icon" onclick="openApp('snake')" style="left: 20px; top: 110px;"><span>🐍</span><br>Snake.exe</div>
    </div>

    <div id="invite-win" class="window" style="width: 280px; left: 50%; top: 40%; transform: translate(-50%, -50%); display:none;">
        <div class="title-bar"><span>Convite.txt</span></div>
        <div class="window-body">
            <h3>Você foi convidado!</h3>
            <p>29/04/2026 às 12:50</p>
            <button onclick="festaSincronizada()" style="padding:10px">Confirmar Presença</button>
        </div>
    </div>

    <div id="app-win" class="window" style="left: 5%; top: 5%;">
        <div class="title-bar"><span id="app-title">App</span><div onclick="closeApp()" style="cursor:pointer">X</div></div>
        <div class="window-body">
            <canvas id="gameCanvas" width="240" height="240"></canvas>
            <div id="mobile-controls">
                <button class="ctrl-btn" onclick="setDir(0,-1)">↑</button>
                <div style="display:flex; gap:5px">
                    <button class="ctrl-btn" onclick="setDir(-1,0)">←</button>
                    <button class="ctrl-btn" onclick="setDir(0,1)">↓</button>
                    <button class="ctrl-btn" onclick="setDir(1,0)">→</button>
                </div>
            </div>
        </div>
    </div>

    <div class="taskbar"><div style="padding:5px; font-weight:bold; border:2px outset #fff">🎂 Iniciar</div></div>

    <audio id="snd-confetti" src="https://www.myinstants.com/media/sounds/confetti-pop-sound.mp3"></audio>
    <audio id="snd-yay" src="https://www.myinstants.com/media/sounds/yay_z1E1ipn.mp3"></audio>
    <audio id="snd-crowd" src="crowd_small_chil_ec049202_9klCwI6.mp3"></audio>

    <script>
        // RITUAL
        const ritualSequence = [2, 9, 0, 4];
        let ritualStep = 0;
        window.addEventListener('mousemove', e => { 
            document.getElementById('flashlight').style.setProperty('--x', (e.clientX || e.touches[0].clientX) + 'px');
            document.getElementById('flashlight').style.setProperty('--y', (e.clientY || e.touches[0].clientY) + 'px');
        });

        function spawnRitual() {
            if(ritualStep >= 4) {
                document.getElementById('ritual-container').style.opacity = '0';
                setTimeout(() => { document.getElementById('ritual-container').style.display = 'none'; document.getElementById('invite-win').style.display = 'block'; }, 1000);
                return;
            }
            const n = document.createElement('div');
            n.className = 'ritual-number'; n.innerText = ritualSequence[ritualStep];
            n.style.left = Math.random()*80+'%'; n.style.top = Math.random()*70+'%';
            n.onclick = n.ontouchstart = (e) => { 
                e.preventDefault();
                document.getElementById('rs'+ritualStep).innerText = ritualSequence[ritualStep];
                n.remove(); ritualStep++; spawnRitual();
            };
            document.getElementById('ritual-game-area').appendChild(n);
        }
        spawnRitual();

        // FESTA COM SOM SINCRONIZADO
        function festaSincronizada() {
            document.getElementById('invite-win').style.display = 'none';
            const s1 = document.getElementById('snd-confetti');
            const s2 = document.getElementById('snd-yay');
            const s3 = document.getElementById('snd-crowd');
            
            // Reinicia e toca todos juntos
            [s1, s2, s3].forEach(s => { s.currentTime = 0; s.play(); });
            
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 10000 });
        }

        // JOGO SNAKE
        let snake = [{x:10,y:10}], dir = {x:0,y:0}, food = {x:5,y:5}, gameActive = false;
        function openApp(app) {
            document.getElementById('app-win').style.display = 'block';
            if(app==='snake') {
                document.getElementById('mobile-controls').style.display = 'flex';
                gameActive = true; 
                snake = [{x:10,y:10}]; dir = {x:1,y:0};
                runSnake();
            }
        }
        function setDir(x,y) { dir = {x:x, y:y}; }
        function closeApp() { gameActive = false; document.getElementById('app-win').style.display = 'none'; }

        function runSnake() {
            if(!gameActive) return;
            const ctx = document.getElementById('gameCanvas').getContext('2d');
            ctx.fillStyle = "black"; ctx.fillRect(0,0,240,240);
            
            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
            if(head.x<0 || head.x>23 || head.y<0 || head.y>23) { gameActive=false; alert("Game Over"); return; }
            
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            else snake.pop();

            ctx.fillStyle = "lime"; snake.forEach(s => ctx.fillRect(s.x*10, s.y*10, 9, 9));
            ctx.fillStyle = "red"; ctx.fillRect(food.x*10, food.y*10, 9, 9);
            setTimeout(runSnake, 150);
        }
    </script>
</body>
</html>
